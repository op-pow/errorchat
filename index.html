<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | Global Communications</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        .chat-container-height {
            height: calc(100vh - 150px);
        }
    </style>
</head>
<body class="bg-slate-100 h-screen flex flex-col md:flex-row overflow-hidden">
    
    <!-- Sidebar -->
    <aside class="w-full md:w-80 bg-white border-r border-slate-200 flex flex-col h-1/3 md:h-full z-20">
        <div class="p-6 border-b border-slate-100 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold">N</div>
                <h1 class="text-xl font-bold text-slate-800 tracking-tight">Nexus</h1>
            </div>
            <button class="text-slate-400 hover:text-indigo-600">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path d="M17.414 2.586a2 2 0 00-2.828 0L7 10.172V13h2.828l7.586-7.586a2 2 0 000-2.828z" />
                    <path fill-rule="evenodd" d="M2 6a2 2 0 012-2h4a1 1 0 010 2H4v10h10v-4a1 1 0 112 0v4a2 2 0 01-2 2H4a2 2 0 01-2-2V6z" clip-rule="evenodd" />
                </svg>
            </button>
        </div>

        <div class="flex-1 overflow-y-auto custom-scrollbar">
            <div class="px-4 py-2 text-xs font-semibold text-slate-400 uppercase tracking-wider">AI Assistance</div>
            <div id="contact-list-ai" class="space-y-1 px-2 mb-4"></div>
            
            <div class="px-4 py-2 text-xs font-semibold text-slate-400 uppercase tracking-wider">Direct Messages</div>
            <div id="contact-list-people" class="space-y-1 px-2"></div>
        </div>

        <div class="p-4 bg-slate-50 border-t border-slate-200">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-slate-300 rounded-full flex-shrink-0 flex items-center justify-center font-bold text-slate-600">ME</div>
                <div class="overflow-hidden">
                    <p class="text-sm font-semibold text-slate-800 truncate">Guest User</p>
                    <p class="text-xs text-green-500">Active Now</p>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col bg-white h-2/3 md:h-full">
        <!-- Chat Header -->
        <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between z-10">
            <div class="flex items-center space-x-3" id="active-chat-header">
                <!-- Populated by JS -->
                <div class="animate-pulse flex space-x-2">
                    <div class="rounded-full bg-slate-200 h-10 w-10"></div>
                    <div class="space-y-2">
                        <div class="h-4 bg-slate-200 rounded w-24"></div>
                        <div class="h-3 bg-slate-200 rounded w-16"></div>
                    </div>
                </div>
            </div>
            <div class="flex space-x-3 text-slate-400">
                <button class="p-2 hover:bg-slate-50 rounded-full transition-colors"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" /></svg></button>
                <button class="p-2 hover:bg-slate-50 rounded-full transition-colors"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" /></svg></button>
                <button class="p-2 hover:bg-slate-50 rounded-full transition-colors"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z" /></svg></button>
            </div>
        </header>

        <!-- Chat Messages Area -->
        <main id="chat-container" class="flex-1 overflow-y-auto p-6 space-y-4 custom-scrollbar bg-slate-50">
            <!-- Messages populated by JS -->
        </main>

        <!-- Input Area -->
        <footer class="bg-white border-t border-slate-200 p-4">
            <form id="chat-form" class="max-w-4xl mx-auto flex items-center space-x-3">
                <button type="button" class="p-2 text-slate-400 hover:text-indigo-600 transition-colors hidden sm:block">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13" />
                    </svg>
                </button>
                <input 
                    type="text" 
                    id="message-input"
                    placeholder="Write a message..."
                    class="flex-1 bg-slate-100 border-none rounded-2xl py-3 px-6 focus:ring-2 focus:ring-indigo-500 outline-none text-sm text-slate-800 placeholder-slate-400"
                    autocomplete="off"
                >
                <button 
                    type="submit" 
                    class="bg-indigo-600 hover:bg-indigo-700 text-white p-3 rounded-2xl shadow-md transition-all transform active:scale-95"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                    </svg>
                </button>
            </form>
        </footer>
    </div>

    <script>
        // Data model
        const contacts = [
            { id: 'ai-nexus', name: 'AI Nexus Assistant', type: 'ai', initial: 'AI', color: 'bg-indigo-600', status: 'Automated System', messages: [
                { text: 'Hello! I am your Nexus AI. How can I assist you with your productivity today?', isUser: false, time: '10:00 AM' }
            ]},
            { id: 'sarah', name: 'Sarah Miller', type: 'human', initial: 'SM', color: 'bg-rose-500', status: 'Online', messages: [
                { text: 'Hey there! Did you get a chance to look at that proposal?', isUser: false, time: '09:45 AM' }
            ]},
            { id: 'alex', name: 'Alex Thompson', type: 'human', initial: 'AT', color: 'bg-emerald-500', status: 'Away', messages: [
                { text: 'I will be in the meeting in 5 minutes.', isUser: false, time: 'Yesterday' }
            ]},
            { id: 'jordan', name: 'Jordan Blake', type: 'human', initial: 'JB', color: 'bg-amber-500', status: 'Busy', messages: [
                { text: 'Please send the files when you can.', isUser: false, time: 'Monday' }
            ]}
        ];

        let currentContactId = 'ai-nexus';

        const chatContainer = document.getElementById('chat-container');
        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');
        const contactListAi = document.getElementById('contact-list-ai');
        const contactListPeople = document.getElementById('contact-list-people');
        const activeChatHeader = document.getElementById('active-chat-header');

        function getCurrentTime() {
            const now = new Date();
            return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function renderContacts() {
            contactListAi.innerHTML = '';
            contactListPeople.innerHTML = '';

            contacts.forEach(contact => {
                const contactBtn = document.createElement('button');
                contactBtn.onclick = () => switchChat(contact.id);
                const isActive = contact.id === currentContactId;
                
                contactBtn.className = `w-full flex items-center space-x-3 p-3 rounded-xl transition-all ${isActive ? 'bg-indigo-50 shadow-sm' : 'hover:bg-slate-50'}`;
                
                contactBtn.innerHTML = `
                    <div class="w-10 h-10 ${contact.color} rounded-full flex-shrink-0 flex items-center justify-center font-bold text-white text-sm shadow-sm">
                        ${contact.initial}
                    </div>
                    <div class="text-left overflow-hidden">
                        <p class="text-sm font-semibold ${isActive ? 'text-indigo-900' : 'text-slate-800'} truncate">${contact.name}</p>
                        <p class="text-xs text-slate-400 truncate">${contact.messages[contact.messages.length - 1].text}</p>
                    </div>
                `;

                if (contact.type === 'ai') {
                    contactListAi.appendChild(contactBtn);
                } else {
                    contactListPeople.appendChild(contactBtn);
                }
            });
        }

        function renderMessages() {
            const contact = contacts.find(c => c.id === currentContactId);
            chatContainer.innerHTML = '';
            
            contact.messages.forEach(msg => {
                const msgDiv = document.createElement('div');
                msgDiv.className = `flex ${msg.isUser ? 'justify-end' : 'justify-start'}`;
                
                const bubbleClass = msg.isUser 
                    ? 'bg-indigo-600 text-white rounded-tr-none' 
                    : 'bg-white border border-slate-200 text-slate-800 rounded-tl-none';

                msgDiv.innerHTML = `
                    <div class="max-w-xs md:max-w-md ${bubbleClass} p-3 px-4 rounded-2xl shadow-sm">
                        <p class="text-sm leading-relaxed">${msg.text}</p>
                        <span class="text-[10px] ${msg.isUser ? 'text-indigo-200' : 'text-slate-400'} mt-1 block">${msg.time}</span>
                    </div>
                `;
                chatContainer.appendChild(msgDiv);
            });

            // Scroll to bottom
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function renderHeader() {
            const contact = contacts.find(c => c.id === currentContactId);
            activeChatHeader.innerHTML = `
                <div class="w-10 h-10 ${contact.color} rounded-full flex items-center justify-center text-white font-bold">
                    ${contact.initial}
                </div>
                <div>
                    <h1 class="text-base font-bold text-slate-800">${contact.name}</h1>
                    <p class="text-[11px] ${contact.status === 'Online' || contact.status === 'Automated System' ? 'text-green-500' : 'text-slate-400'} flex items-center uppercase tracking-wider font-semibold">
                        <span class="w-1.5 h-1.5 ${contact.status === 'Online' || contact.status === 'Automated System' ? 'bg-green-500' : 'bg-slate-300'} rounded-full mr-1.5"></span>
                        ${contact.status}
                    </p>
                </div>
            `;
        }

        function switchChat(id) {
            currentContactId = id;
            renderHeader();
            renderContacts();
            renderMessages();
            messageInput.focus();
        }

        function handleBotResponse(contactId) {
            const contact = contacts.find(c => c.id === contactId);
            let responses = [];
            
            if (contact.type === 'ai') {
                responses = [
                    "That's a great question! Nexus AI is designed to help you process information faster.",
                    "I can analyze that for you. Please provide more details.",
                    "Our documentation suggests that this workflow is optimal for your project.",
                    "Is there anything else I can assist with?"
                ];
            } else {
                responses = [
                    "Got it! I'll look into this.",
                    "Sounds good to me. Let's touch base later.",
                    "Could you elaborate on that? I'm curious.",
                    "Just saw this. Typing a longer reply soon...",
                    "Thanks for the update!"
                ];
            }
            
            const randomResponse = responses[Math.floor(Math.random() * responses.length)];
            
            // Typing simulation delay
            setTimeout(() => {
                const newMsg = { text: randomResponse, isUser: false, time: getCurrentTime() };
                contact.messages.push(newMsg);
                
                // Only render if we're still looking at this contact
                if (currentContactId === contactId) {
                    renderMessages();
                }
                renderContacts(); // Update last message in sidebar
            }, 1500 + Math.random() * 2000);
        }

        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            
            if (text) {
                const contact = contacts.find(c => c.id === currentContactId);
                const newMsg = { text: text, isUser: true, time: getCurrentTime() };
                contact.messages.push(newMsg);
                
                messageInput.value = '';
                renderMessages();
                renderContacts();
                
                handleBotResponse(currentContactId);
            }
        });

        // Init
        renderContacts();
        renderHeader();
        renderMessages();
    </script>
</body>
</html>
