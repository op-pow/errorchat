<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Chat | Connected</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-50 h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between shadow-sm z-10">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-indigo-600 rounded-full flex items-center justify-center text-white font-bold">
                N
            </div>
            <div>
                <h1 class="text-lg font-semibold text-slate-800">Nexus Support</h1>
                <p class="text-xs text-green-500 flex items-center">
                    <span class="w-2 h-2 bg-green-500 rounded-full mr-1.5 animate-pulse"></span>
                    Online Now
                </p>
            </div>
        </div>
        <div class="flex space-x-4 text-slate-400">
            <button class="hover:text-indigo-600 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
                </svg>
            </button>
            <button class="hover:text-indigo-600 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z" />
                </svg>
            </button>
        </div>
    </header>

    <!-- Chat Area -->
    <main id="chat-container" class="flex-1 overflow-y-auto p-6 space-y-4 custom-scrollbar">
        <!-- Welcome Message -->
        <div class="flex justify-start">
            <div class="max-w-xs md:max-w-md bg-white border border-slate-200 p-4 rounded-2xl rounded-tl-none shadow-sm">
                <p class="text-sm text-slate-800 leading-relaxed">
                    Hi there! 👋 Welcome to Nexus Chat. How can we help you today?
                </p>
                <span class="text-[10px] text-slate-400 mt-2 block">10:00 AM</span>
            </div>
        </div>
    </main>

    <!-- Input Area -->
    <footer class="bg-white border-t border-slate-200 p-4">
        <form id="chat-form" class="max-w-4xl mx-auto flex items-center space-x-3">
            <button type="button" class="text-slate-400 hover:text-indigo-600 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13" />
                </svg>
            </button>
            <input 
                type="text" 
                id="message-input"
                placeholder="Type your message here..." 
                class="flex-1 bg-slate-100 border-none rounded-full py-3 px-6 focus:ring-2 focus:ring-indigo-500 outline-none text-sm text-slate-800 placeholder-slate-400"
                autocomplete="off"
            >
            <button 
                type="submit" 
                class="bg-indigo-600 hover:bg-indigo-700 text-white p-3 rounded-full shadow-lg transition-all transform active:scale-95"
            >
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                </svg>
            </button>
        </form>
    </footer>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');

        function getCurrentTime() {
            const now = new Date();
            return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function scrollToBottom() {
            chatContainer.scrollTo({
                top: chatContainer.scrollHeight,
                behavior: 'smooth'
            });
        }

        function addMessage(text, isUser = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `flex ${isUser ? 'justify-end' : 'justify-start'}`;
            
            const bubbleClass = isUser 
                ? 'bg-indigo-600 text-white rounded-tr-none' 
                : 'bg-white border border-slate-200 text-slate-800 rounded-tl-none';

            messageDiv.innerHTML = `
                <div class="max-w-xs md:max-w-md ${bubbleClass} p-4 rounded-2xl shadow-sm">
                    <p class="text-sm leading-relaxed">${text}</p>
                    <span class="text-[10px] ${isUser ? 'text-indigo-200' : 'text-slate-400'} mt-2 block">${getCurrentTime()}</span>
                </div>
            `;

            chatContainer.appendChild(messageDiv);
            scrollToBottom();
        }

        function handleBotResponse() {
            const responses = [
                "That sounds interesting! Tell me more.",
                "I'm here to help you with any questions you might have.",
                "Our team usually responds within a few minutes.",
                "Nexus is the leading platform for streamlined communication.",
                "I've logged your request in our system."
            ];
            const randomResponse = responses[Math.floor(Math.random() * responses.length)];
            
            // Simulate typing delay
            setTimeout(() => {
                addMessage(randomResponse, false);
            }, 1000);
        }

        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const message = messageInput.value.trim();
            
            if (message) {
                addMessage(message, true);
                messageInput.value = '';
                handleBotResponse();
            }
        });

        // Focus input on load
        window.onload = () => messageInput.focus();
    </script>
</body>
</html>"}
